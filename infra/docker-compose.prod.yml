# Hosted configuration template; applying it to a real host is a separate action.
name: plr

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "5"}

x-runtime: &runtime
  build:
    context: ../back-office
    args:
      VITE_GOVERNANCE_CONTRACT: ${PLR_GOVERNANCE_CONTRACT:?}
      VITE_LEDGER_CHAIN_ID: ${PLR_LEDGER_CHAIN_ID:?}
      VITE_LEDGER_WALLET_RPC: ${PLR_LEDGER_WALLET_RPC:?}
  image: atest-back-office:release
  cap_drop: [ALL]
  environment: &environment
    NODE_ENV: production
    HOST: 127.0.0.1
    PORT: "8088"
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: atest
    PGPASSWORD: ${POSTGRES_PASSWORD:?}
    PGDATABASE: atest
    BACK_OFFICE_TOKEN_SECRET: ${BACK_OFFICE_TOKEN_SECRET:?}
    PLR_FIELD_KMS_KEY_ID: ${PLR_FIELD_KMS_KEY_ID:?}
    BACK_OFFICE_ISSUANCE_ENABLED: "true"
    BACK_OFFICE_CONSOLE_ENABLED: "true"
    BACK_OFFICE_PUBLIC_ORIGIN: https://${PLR_PUBLIC_HOSTNAME:?}
    PLR_NUM_PROXIES: "2"
    REDIS_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    PLR_WORKER_CONCURRENCY: ${PLR_WORKER_CONCURRENCY:-2}
    PLR_GOVERNANCE_RECONCILE_SECONDS: ${PLR_GOVERNANCE_RECONCILE_SECONDS:-120}
    PLR_STANDING_SWEEP_SECONDS: ${PLR_STANDING_SWEEP_SECONDS:-60}
    PLR_REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/2
    PLR_ISSUER_DID: ${PLR_ISSUER_DID:?}
    # EBSI's Core API v1: authorisation, the registries and the Ledger API.
    PLR_EBSI_URL: ${PLR_EBSI_API_ORIGIN:?}
    PLR_DIDR_URL: ${PLR_EBSI_API_ORIGIN}/v1/did-registry/identifiers
    PLR_TIR_URL: ${PLR_EBSI_API_ORIGIN}/v1/issuers-registry
    PLR_TSR_URL: ${PLR_EBSI_API_ORIGIN}/v1/schemas-registry
    PLR_TRUSTED_ROOT_DIDS: ${PLR_TRUSTED_ROOT_DIDS:?}
    PLR_LEDGER_STATUS_ENTRY_SCHEMA_URL: ${PLR_LEDGER_STATUS_ENTRY_SCHEMA_URL:?}
    PLR_LEDGER_RPC_URL: ${PLR_LEDGER_RPC_URL:?}
    PLR_LEDGER_CHAIN_ID: ${PLR_LEDGER_CHAIN_ID:?}
    PLR_GOVERNANCE_CONTRACT: ${PLR_GOVERNANCE_CONTRACT:?}
    PLR_CERTIFICATE_REGISTRY: ${PLR_CERTIFICATE_REGISTRY:?}
    PLR_GOVERNANCE_CONSOLE_ROLES: ${PLR_GOVERNANCE_CONSOLE_ROLES:-A,B}
    AWS_REGION: ${AWS_REGION:?}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    BACK_OFFICE_PASSWORD_RECOVERY_ENABLED: ${BACK_OFFICE_PASSWORD_RECOVERY_ENABLED:-false}
    BACK_OFFICE_PASSWORD_RECOVERY_KEY: ${BACK_OFFICE_PASSWORD_RECOVERY_KEY:-}
    POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    BACK_OFFICE_TIMESTAMP_ENABLED: ${BACK_OFFICE_TIMESTAMP_ENABLED:-false}
    BACK_OFFICE_TIMESTAMP_KMS_KEY_ID: ${BACK_OFFICE_TIMESTAMP_KMS_KEY_ID:-}
    BACK_OFFICE_TIMESTAMP_RPC_URL: ${BACK_OFFICE_TIMESTAMP_RPC_URL:-}
    BACK_OFFICE_TIMESTAMP_CHAIN_ID: ${BACK_OFFICE_TIMESTAMP_CHAIN_ID:-}
    BACK_OFFICE_TIMESTAMP_CONTRACT: ${BACK_OFFICE_TIMESTAMP_CONTRACT:-}
    BACK_OFFICE_TIMESTAMP_ACCESS_TOKEN_FILE: /run/timestamp/access-token
    BACK_OFFICE_TIMESTAMP_MAX_GAS_PRICE_WEI: ${BACK_OFFICE_TIMESTAMP_MAX_GAS_PRICE_WEI:-0}
  volumes:
    - ${PLR_TIMESTAMP_TOKEN_DIR:-./prod/timestamp}:/run/timestamp:ro
  networks: [edge, core, data]

services:
  migrate:
    <<: *runtime
    command: [node, data/migrate.ts]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: [*hardening, *runtime]
    init: true
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8088/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: [*hardening, *runtime]
    command: [node, server/worker/start.ts]
    init: true
    stop_grace_period: 90s
    networks: [core, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, server/worker/health.ts]
      interval: 15s
      timeout: 8s
      retries: 10

  backend-mesh:
    <<: *hardening
    image: nginx:1.27-alpine
    network_mode: service:backend
    volumes:
      - ./prod/nginx/backend-mesh.conf.template:/etc/nginx/templates/mesh.conf.template:ro
      - ./prod/nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PLR_TLS_DIR:-./prod/tls}/backend.crt:/tls/backend.crt:ro
      - ${PLR_TLS_DIR:-./prod/tls}/backend.key:/tls/backend.key:ro
      - ${PLR_TLS_DIR:-./prod/tls}/ca.crt:/tls/ca.crt:ro
    depends_on: [backend]

  edge:
    <<: *hardening
    build:
      context: ../back-office
      dockerfile: web/Dockerfile
      args:
        VITE_GOVERNANCE_CONTRACT: ${PLR_GOVERNANCE_CONTRACT}
        VITE_LEDGER_CHAIN_ID: ${PLR_LEDGER_CHAIN_ID}
        VITE_LEDGER_WALLET_RPC: ${PLR_LEDGER_WALLET_RPC}
    image: atest-edge:release
    environment:
      PLR_PUBLIC_HOSTNAME: ${PLR_PUBLIC_HOSTNAME}
      PLR_CONSOLE_HOSTNAME: ${PLR_CONSOLE_HOSTNAME:?}
      PLR_STAFF_CIDR: ${PLR_STAFF_CIDR:?}
      PLR_LEDGER_RPC_URL: ${PLR_LEDGER_RPC_URL}
      PLR_LEDGER_WALLET_RPC: ${PLR_LEDGER_WALLET_RPC}
    volumes:
      - ./prod/nginx/edge.conf.template:/etc/nginx/templates/edge.conf.template:ro
      - ./prod/nginx/backend-upstream.inc.template:/etc/nginx/templates/backend-upstream.inc.template:ro
      - ./prod/nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PLR_TLS_DIR:-./prod/tls}/public.crt:/tls/public.crt:ro
      - ${PLR_TLS_DIR:-./prod/tls}/public.key:/tls/public.key:ro
      - ${PLR_TLS_DIR:-./prod/tls}/edge.crt:/tls/edge.crt:ro
      - ${PLR_TLS_DIR:-./prod/tls}/edge.key:/tls/edge.key:ro
      - ${PLR_TLS_DIR:-./prod/tls}/ca.crt:/tls/ca.crt:ro
    ports: ["80:80", "443:443"]
    networks: [public, edge]
    depends_on: [backend-mesh]

  postgres:
    <<: *hardening
    image: postgres:17
    environment:
      POSTGRES_USER: atest
      POSTGRES_DB: atest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [product-postgres:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atest -d atest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *hardening
    image: redis:7
    command: [redis-server, --requirepass, "${REDIS_PASSWORD}", --appendonly, "yes"]
    volumes: [redisdata:/data]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  public: {}
  edge: {internal: true}
  core: {}
  data: {internal: true}
volumes:
  product-postgres: {}
  redisdata: {}
